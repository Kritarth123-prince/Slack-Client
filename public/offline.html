<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slack Web — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f7f7fb; color: #17172a; }
      @media (prefers-color-scheme: dark) { body { background: #0b0b14; color: #ededf3; } }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      .icon { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 28px; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: #6b7280; }
      a { display: inline-block; padding: .6rem 1.2rem; border-radius: 999px; background: linear-gradient(135deg, #6366f1, #ec4899); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">💬</div>
      <h1>You're offline</h1>
      <p>Conversations you've opened recently are still available. Everything else will load once you're back online.</p>
      <a href="/app">Open recent conversations</a>
    </main>
  </body>
</html>
