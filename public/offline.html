<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slack Web — offline</title>
    <style>
      :root { --canvas: #f4f5f7; --surface: #ffffff; --fg: #101828; --muted: #475467; --line: #e3e6ea; --accent: #0f766e; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #0c0e12; --surface: #14171c; --fg: #e8eaed; --muted: #a9b1bc; --line: #242a32; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--canvas); color: var(--fg); }
      main { max-width: 22rem; padding: 2.5rem 2rem; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
      .icon { width: 48px; height: 48px; margin: 0 auto 1.25rem; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 1.125rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; line-height: 1.5; }
      a { display: inline-block; padding: .6rem 1.1rem; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="M12 20h.01"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>Conversations you've opened recently are still available. Everything else will load once you're back online.</p>
      <a href="/app">Open recent conversations</a>
    </main>
  </body>
</html>
